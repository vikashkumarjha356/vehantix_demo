<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Vehantix — Your complete vehicle dashboard. Track vehicle details, challans, service history, documents, and more." />
  <title>Vehantix — Vehicle Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="top-nav__brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-2-2.2-3.3C12.9 5.5 11.8 5 10.5 5H5.2C3.9 5 2.7 5.6 2 6.7L.5 9.2C.2 9.6 0 10.1 0 10.5V16c0 .6.4 1 1 1h1"/>
        <circle cx="7" cy="17" r="2"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
      <span>Vehantix</span>
    </div>
    <div class="top-nav__tabs">
      <button class="top-nav__btn active" data-target="tab-home">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span class="top-nav__label">Home</span>
      </button>
      <button class="top-nav__btn" data-target="tab-ownership">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span class="top-nav__label">Owner</span>
      </button>
      <button class="top-nav__btn" data-target="tab-history">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </span>
        <span class="top-nav__label">History</span>
      </button>
      <button class="top-nav__btn" data-target="tab-services">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </span>
        <span class="top-nav__label">Service</span>
      </button>
      <button class="top-nav__btn" data-target="tab-docs">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </span>
        <span class="top-nav__label">Docs</span>
      </button>
      <button class="top-nav__btn" data-target="tab-medical">
        <span class="top-nav__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        </span>
        <span class="top-nav__label">Medical</span>
      </button>
    </div>
    <div class="top-nav__user">
      <div class="header__avatar" style="width: 36px; height: 36px; font-size: 14px;">
        <span>VK</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="main">
    <!-- Tab 1: Home (Overview) -->
    <div id="tab-home" class="tab-content active">
      <section id="section-vehicle" class="section"></section>
      <section id="section-parts" class="section"></section>
    </div>

    <!-- Tab 2: Ownership -->
    <div id="tab-ownership" class="tab-content" style="display:none;">
      <section id="section-ownership" class="section"></section>
    </div>

    <!-- Tab 3: History -->
    <div id="tab-history" class="tab-content" style="display:none;">
      <section id="section-challans" class="section"></section>
      <section id="section-accidents" class="section"></section>
    </div>

    <!-- Tab 4: Service -->
    <div id="tab-services" class="tab-content" style="display:none;">
      <section id="section-services" class="section"></section>
    </div>

    <!-- Tab 5: Documents -->
    <div id="tab-docs" class="tab-content" style="display:none;">
      <section id="section-documents" class="section"></section>
    </div>

    <!-- Tab 3: Medical -->
    <div id="tab-medical" class="tab-content" style="display:none;">
      <section id="section-medical" class="section"></section>
      <section id="section-emergency" class="section"></section>
    </div>
  </main>



  <script type="module" src="/src/main.js"></script>
</body>

</html>
